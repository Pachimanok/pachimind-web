<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PachiMind">
  <meta name="theme-color" content="#e8a020">
  <title>PachiMind</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:  #0c0b09; --bg2: #161410; --bg3: #1e1c17; --bg4: #252218;
      --b:   #2a2820; --bb:  #38352a;
      --ac:  #e8a020; --acd: rgba(232,160,32,.1); --acg: rgba(232,160,32,.2);
      --ac2: #1de9b0; --ac2d:rgba(29,233,176,.1);
      --pu:  #c084fc; --pud: rgba(192,132,252,.1);
      --rd:  #f87171; --rdd: rgba(248,113,113,.1);
      --tx:  #f0ece4; --tx2: #9e9480; --tx3: #5e5848;
      --r:9px; --rl:13px;
      --sidebar:224px;
    }
    [data-theme="light"]{
      --bg:  #f5f3ee; --bg2: #ede9e0; --bg3: #e4dfd4; --bg4: #dbd5c8;
      --b:   #ccc6b8; --bb:  #b8b1a0;
      --ac:  #c07010; --acd: rgba(192,112,16,.1); --acg: rgba(192,112,16,.2);
      --ac2: #0a8060; --ac2d:rgba(10,128,96,.1);
      --pu:  #7c3aed; --pud: rgba(124,58,237,.1);
      --rd:  #dc2626; --rdd: rgba(220,38,38,.1);
      --tx:  #1c1a16; --tx2: #5a5446; --tx3: #9a9080;
    }
    html,body{height:100%}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex}

    .memory-view{line-height:1.55;overflow-wrap:anywhere}
    .memory-view p{margin:10px 0}
    .memory-view h3{margin:18px 0 10px}
    .memory-view .btn{display:inline-flex;margin:4px 4px 4px 0;max-width:100%;white-space:normal;text-align:left}
    .memory-view ul{padding-left:24px}
    .memory-view blockquote{border-left:3px solid var(--ac);padding:8px 12px;margin:12px 0;color:var(--tx2)}
    .memory-view label{font-size:13px;color:var(--tx2)}
    .memory-view textarea{resize:vertical;line-height:1.5}
    /* ══ SIDEBAR ══════════════════════════════════════════════ */
    .sidebar{
      width:var(--sidebar);flex-shrink:0;
      background:var(--bg2);border-right:1px solid var(--b);
      display:flex;flex-direction:column;height:100vh;position:sticky;top:0;
      overflow-y:auto;
    }
    .sb-brand{
      padding:22px 20px 16px;
      border-bottom:1px solid var(--b);
    }
    .brand-name{
      font-family:'Fraunces',serif;font-size:20px;font-weight:700;letter-spacing:-.02em;
      color:var(--tx);line-height:1;
    }
    .brand-name span{color:var(--ac)}
    .brand-sub{font-size:11px;color:var(--tx3);margin-top:4px;font-family:'JetBrains Mono',monospace}
    .sb-section{padding:16px 12px 8px;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
    .nav-item{
      display:flex;align-items:center;gap:10px;
      padding:8px 12px;border-radius:var(--r);margin:1px 8px;
      cursor:pointer;transition:all .15s;font-size:13.5px;color:var(--tx2);
      text-decoration:none;
    }
    .nav-item:hover{background:var(--bg3);color:var(--tx)}
    .nav-item.on{background:var(--acd);color:var(--ac);font-weight:500}
    .nav-item.on .ni-icon{filter:none}
    .ni-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
    .ni-badge{margin-left:auto;background:var(--ac);color:#080600;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px}
    .sb-stats{margin:auto 0 0;padding:16px;border-top:1px solid var(--b)}
    .sb-stat{display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--tx3)}
    .sb-stat span{color:var(--tx2);font-family:'JetBrains Mono',monospace;font-size:11px}

    /* ══ MAIN ══════════════════════════════════════════════════ */
    .main-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow-y:auto;height:100vh}
    .topbar{
      display:flex;align-items:center;gap:12px;
      padding:0 28px;height:52px;
      background:rgba(12,11,9,.9);backdrop-filter:blur(16px);
      border-bottom:1px solid var(--b);position:sticky;top:0;z-index:40;
    }
    .page-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;color:var(--tx);flex:1}
    .search-box{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--b);border-radius:var(--r);padding:6px 12px;transition:border-color .2s}
    .search-box:focus-within{border-color:rgba(232,160,32,.4)}
    .search-box input{background:none;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--tx);width:200px}
    .search-box input::placeholder{color:var(--tx3)}
    .main-content{flex:1;padding:28px;max-width:1040px;width:100%;overflow:hidden}
    .main-content.full{padding:0;max-width:100%}

    /* ══ TABLERO ═══════════════════════════════════════════════ */
    .stats-row{display:flex;gap:10px;margin-bottom:24px;flex-wrap:wrap}
    .stat-card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:14px 18px;min-width:110px}
    .stat-n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1;display:block;margin-bottom:4px}
    .stat-l{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
    .af-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
    .af{padding:5px 14px;border:1px solid var(--b);border-radius:20px;font-size:12.5px;color:var(--tx3);background:transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
    .af:hover,.af.on{background:var(--bg3);color:var(--tx);border-color:var(--bb)}
    .board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
    .board-col{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);overflow:hidden}
    .bc-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--b)}
    .bc-icon{font-size:13px}
    .bc-title{font-family:'Fraunces',serif;font-size:13px;font-weight:600;flex:1}
    .bc-count{font-size:10px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
    .bc-body{padding:6px}
    .note-row{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s}
    .note-row:hover{background:var(--bg3)}
    .nr-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:6px}
    .nr-dot.alta{background:var(--rd)}.nr-dot.media{background:var(--ac)}.nr-dot.baja,.nr-dot.none{background:var(--bb)}
    .nr-title{font-size:13px;line-height:1.35;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nr-meta{font-size:11px;color:var(--tx3)}
    .bc-empty{padding:16px;text-align:center;font-size:12px;color:var(--tx3);font-style:italic}
    .bc-more{padding:6px 10px;font-size:11px;color:var(--tx3);cursor:pointer;transition:color .2s;font-style:italic}
    .bc-more:hover{color:var(--tx2)}

    /* ══ NOTE DETAIL OVERLAY ════════════════════════════════════ */
    .overlay{position:fixed;inset:0;z-index:100;display:flex}
    .overlay-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px)}
    .overlay-panel{position:relative;z-index:1;margin-left:auto;width:520px;max-width:95vw;background:var(--bg2);border-left:1px solid var(--b);overflow-y:auto;display:flex;flex-direction:column;height:100%}
    .op-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--bg2);z-index:2}
    .op-close{background:none;border:none;cursor:pointer;color:var(--tx3);font-size:17px;margin-left:auto;padding:4px;transition:color .2s;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
    .op-close:hover{color:var(--tx)}
    .op-body{padding:22px;flex:1;overflow-y:auto}
    .op-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:12px;line-height:1.3;color:var(--tx)}
    .tag-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
    .tag{font-size:10px;padding:2px 8px;border-radius:4px;background:var(--bg3);border:1px solid var(--b);color:var(--tx2);font-family:'JetBrains Mono',monospace}
    .tag.ac{background:var(--acd);color:var(--ac);border-color:rgba(232,160,32,.25)}
    .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    .mg{background:var(--bg3);border-radius:8px;padding:10px 12px}
    .mg-k{font-size:10px;color:var(--tx3);margin-bottom:2px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em}
    .mg-v{font-size:13px;font-weight:500}
    .content-md{font-size:13.5px;line-height:1.8;color:var(--tx2);white-space:pre-wrap}
    .content-md h1,.content-md h2,.content-md h3{font-family:'Fraunces',serif;color:var(--tx);margin:14px 0 6px}
    .content-md h1{font-size:18px}.content-md h2{font-size:16px}.content-md h3{font-size:14px}

    /* ══ SEARCH ══════════════════════════════════════════════════ */
    .sr-item{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:13px 15px;margin-bottom:8px;cursor:pointer;transition:border-color .2s}
    .sr-item:hover{border-color:var(--bb)}
    .sr-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:4px}
    .sr-meta{font-size:11px;color:var(--tx3);margin-bottom:5px}
    .sr-excerpt{font-size:12.5px;color:var(--tx2);line-height:1.55}

    /* ══ FORMS ════════════════════════════════════════════════ */
    .form-wrap{max-width:600px}
    .section-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:6px}
    .section-sub{font-size:13px;color:var(--tx2);margin-bottom:24px;line-height:1.5}
    .field-label{font-size:11px;color:var(--tx3);margin-bottom:6px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;display:block}
    .fi{width:100%;background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:10px 14px;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--tx);outline:none;transition:border-color .2s;margin-bottom:14px}
    .fi:focus{border-color:rgba(232,160,32,.5)}.fi::placeholder{color:var(--tx3)}
    textarea.fi{resize:vertical;min-height:130px;line-height:1.65;font-size:13.5px}
    select.fi{cursor:pointer}

    /* ══ AUDIO ══════════════════════════════════════════════════ */
    .audio-row{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
    .rec-btn{width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--bg3);color:var(--tx2);transition:all .2s}
    .rec-btn:hover{background:var(--bg4);color:var(--tx)}
    .rec-btn.rec{background:rgba(248,113,113,.15);color:var(--rd);animation:rp 1.2s ease-in-out infinite}
    @keyframes rp{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)}50%{box-shadow:0 0 0 7px rgba(248,113,113,0)}}
    .rec-label{flex:1;font-size:13px;color:var(--tx3)}.rec-label.active{color:var(--rd)}
    .rec-time{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3)}

    /* ══ BUTTONS ════════════════════════════════════════════════ */
    .btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:var(--r);border:none;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
    .btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important}
    .btn-full{width:100%;margin-bottom:10px}
    .btn-primary{background:var(--ac);color:#080600;font-weight:700}
    .btn-primary:hover:not(:disabled){opacity:.88;transform:translateY(-1px);box-shadow:0 4px 18px var(--acg)}
    .btn-gemini{background:var(--pud);color:var(--pu);border:1px solid rgba(192,132,252,.25)}
    .btn-gemini:hover:not(:disabled){background:rgba(192,132,252,.18)}
    .btn-ghost{background:var(--bg3);color:var(--tx2);border:1px solid var(--bb)}
    .btn-ghost:hover:not(:disabled){color:var(--tx);border-color:var(--tx3)}
    .btn-ye{background:var(--acd);color:var(--ac);border:1px solid rgba(232,160,32,.25)}
    .btn-ye:hover:not(:disabled){background:rgba(232,160,32,.18)}
    .btn-back{background:none;border:none;cursor:pointer;color:var(--tx3);font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:color .2s;margin-bottom:16px;padding:0}
    .btn-back:hover{color:var(--tx2)}

    /* ══ REVIEW / ENTITY CARDS ══════════════════════════════════ */
    .review-box{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);padding:20px;margin-bottom:14px}
    .gemini-note{background:var(--pud);border:1px solid rgba(192,132,252,.2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--tx2);line-height:1.6;font-style:italic;margin:10px 0}
    .field-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(42,40,32,.8)}
    .field-row:last-child{border-bottom:none}
    .fk{font-size:11px;color:var(--tx3)}
    .fsel{background:var(--bg3);border:1px solid var(--b);border-radius:5px;padding:4px 8px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--tx);outline:none;cursor:pointer}
    .fsel:focus{border-color:rgba(232,160,32,.4)}
    .fsel-w{width:100%;padding:8px 10px;margin-bottom:12px}
    .or-row{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--tx3);margin:12px 0}
    .or-row::before,.or-row::after{content:'';flex:1;height:1px;background:var(--b)}
    .entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .en-card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rl);cursor:pointer;transition:border-color .2s;overflow:hidden}
    .en-card:hover{border-color:var(--bb)}
    .en-card-head{padding:13px 15px;border-bottom:1px solid var(--b);background:var(--bg3)}
    .en-card-name{font-family:'Fraunces',serif;font-size:14px;font-weight:600}
    .en-card-body{padding:10px 15px}
    .en-card-role{font-size:11px;color:var(--ac);font-family:'JetBrains Mono',monospace;margin-bottom:4px}
    .en-card-org{font-size:12px;color:var(--tx2)}

    /* ══ ALERTS / STATES ════════════════════════════════════════ */
    .alert-err{background:var(--rdd);border:1px solid rgba(248,113,113,.2);border-radius:var(--r);padding:10px 12px;font-size:12.5px;color:var(--rd);margin-bottom:12px;line-height:1.5}
    .alert-sug{background:rgba(232,160,32,.07);border:1px solid rgba(232,160,32,.2);border-radius:var(--rl);padding:16px;margin-top:20px}
    .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px 0}
    .spinner{width:16px;height:16px;border:2px solid var(--bb);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-label{font-size:13px;color:var(--tx3)}
    .empty-state{text-align:center;padding:48px 0}
    .es-icon{font-size:32px;opacity:.25;margin-bottom:10px}
    .es-text{font-size:13px;color:var(--tx3);font-style:italic}
    .success{text-align:center;padding:48px 0}
    .s-icon{width:52px;height:52px;border-radius:50%;background:var(--acd);border:1px solid rgba(232,160,32,.25);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
    .s-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin-bottom:8px}
    .s-path{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3);margin-bottom:24px;word-break:break-all;line-height:1.6}
    .hint{font-size:11px;color:var(--tx3);text-align:center;margin-top:6px;font-style:italic}
    .divider{border:none;border-top:1px solid var(--b);margin:14px 0}

    /* ══ LOGIN ══════════════════════════════════════════════════ */
    .login-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:18px;padding:24px;width:100%}
    .login-brand{font-family:'Fraunces',serif;font-size:36px;font-weight:700;letter-spacing:-.02em}
    .login-brand span{color:var(--ac)}
    .login-sub{font-size:13px;color:var(--tx3);margin-top:-8px}
    .login-line{width:40px;height:1px;background:var(--b)}

    /* ══ MOBILE ══════════════════════════════════════════════ */
    @media(max-width:700px){
      body{flex-direction:column}

      /* ── Sidebar → Bottom Nav ── */
      .sidebar{
        position:fixed;bottom:0;left:0;right:0;top:auto;
        width:100%;height:56px;
        flex-direction:row;align-items:center;justify-content:space-around;
        border-right:none;border-top:1px solid var(--b);
        overflow-x:auto;z-index:200;
        padding:0 4px;padding-bottom:env(safe-area-inset-bottom);
      }
      .sb-brand,.sb-section,.sb-stats{display:none}
      .nav-item{
        flex-direction:column;gap:2px;padding:6px 10px;margin:0;
        font-size:9px;min-width:44px;text-align:center;border-radius:8px;
        flex:1;justify-content:center;
      }
      .ni-icon{font-size:16px}
      .ni-badge{position:absolute;top:4px;right:4px;font-size:8px;padding:1px 4px}

      /* ── Main area ── */
      .main-area{
        flex:1;overflow-y:auto;padding-bottom:70px;
        min-height:0;
      }
      .topbar{
        position:sticky;top:0;z-index:100;
        padding:10px 14px;gap:8px;
      }
      .page-title{font-size:15px}
      .search-box{flex:1}
      .search-box input{width:100%;min-width:0}
      .main-content{padding:14px}

      /* ── Board grid ── */
      .board-grid{grid-template-columns:1fr}
      .stats-row{gap:8px}
      .stat-card{padding:10px 12px}

      /* ── Overlay full screen ── */
      .overlay-panel{
        position:fixed;inset:0;width:100%;max-height:100%;
        border-radius:0;border-left:none;
        padding-bottom:env(safe-area-inset-bottom);
      }
      .op-body{padding:14px;padding-bottom:80px}

      /* ── Forms ── */
      .form-wrap{max-width:100%;padding:14px}
      .af-row{flex-wrap:wrap;gap:4px}
      .af{min-height:36px}

      /* ── Entity grid → 2 cols ── */
      .entity-grid{grid-template-columns:1fr 1fr}

      /* ── Chat ── */
      #chat-msgs{min-height:200px}

      /* ── Buttons touch targets ── */
      .btn{min-height:40px}
      .btn-primary,.btn-ghost{padding:10px 16px}
    }
.todo-view{line-height:1.5;overflow-wrap:anywhere}.todo-view input,.todo-view select,.todo-view textarea{background:var(--bg2);color:var(--tx);border:1px solid var(--bb);border-radius:8px;padding:9px 11px;font:inherit;min-height:40px}.todo-view input:focus-visible,.todo-view select:focus-visible,.todo-view textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.todo-view label{font-size:13px;color:var(--tx2)}.todo-view textarea{resize:vertical}.todo-view button:disabled{opacity:.5;cursor:wait}.todo-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.todo-fields label{display:grid;gap:5px}.todo-fields input,.todo-fields select{width:100%}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--bb);border-radius:2px}
  </style>
</head>
<body>
<div id="app" style="display:flex;width:100%;min-height:100vh"></div>
<script>
// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const S={
  token:sessionStorage.getItem('pm_token'),
  view:'tablero',
  stats:null,drafts_count:0,
  areaFilter:'todos',
  boards:{},boardsLoading:false,
  openNote:null,openLoading:false,
  searchQ:'',searchResults:null,searchLoading:false,
  nnStep:'input',nnTitle:'',nnContent:'',nnParsed:null,nnResult:null,nnError:null,nnConfirming:false,nnManualResp:'',
  recorder:null,recording:false,recTimer:null,recSecs:0,transcribing:false,
  ibStep:'list',ibDrafts:[],ibLoading:false,ibError:null,ibNote:null,ibParsed:null,ibResult:null,ibConfirming:false,ibManualResp:'',
  paLoading:false,paTotal:0,paDone:0,paResults:[],paError:null,
  enTab:'persona',enList:{},enLoading:false,enError:null,
  enStep:'list',enForm:{title:'',tipo:'persona',area:'Laboral',organizacion:'',cliente:'',rol:'',tags:'',content:''},
  enResult:null,enError2:null,enConfirming:false,enSuggestions:[],
  loginError:null,
  // vault sync
  vlBroken:null,vlBrokenLoading:false,vlBrokenError:null,
  vlGenResult:null,vlGenLoading:false,vlGenError:null,vlGenDryRun:true,
  // sistema
  sysData:null,sysLoading:false,sysError:null,
  // tags db
  allNotes:[],tagSelected:null,tagSearch:'',
  // attachments
  attachUploading:false,attachError:null,attachList:[],
  // semantic suggestions
  semSuggestions:null,semLoading:false,semError:null,semSelected:[],
  // chat
  chatMessages:[],chatInput:'',chatLoading:false,chatError:null,
  // theme
  theme:localStorage.getItem('pm_theme')||'dark',
  // board expansion
  boardExpanded:{},
  // entity edit
  enEditing:null,
  // reuniones (NotebookLM)
  rnStep:'notebooks',rnNotebooks:[],rnNotebooksLoading:false,
  rnNotebookId:null,rnNotebookTitle:'',
  rnSources:[],rnSourcesLoading:false,rnSelected:[],
  rnArea:'Laboral',rnError:null,
  // sacar el jugo
  xfLoading:false,xfError:null,
}

const VIEWS=[
  {id:'tablero',  icon:'◈', label:'Tablero'},
  {id:'memoria', icon:'◷', label:'Memoria'},
  {id:'todo', icon:'✓', label:'TODO'},
  {id:'nueva',    icon:'✦', label:'Nueva nota'},
  {id:'reuniones',icon:'⏺', label:'Reuniones'},
  {id:'entidades',icon:'◎', label:'Entidades'},
  {id:'inbox',    icon:'▽', label:'Inbox',badge:true},
  {id:'chat',     icon:'◉', label:'Chat IA'},
  {id:'vault',    icon:'⬡', label:'Vault'},
  {id:'tags',     icon:'#', label:'Tags'},
  {id:'sistema',  icon:'◇', label:'Sistema'},
]

// ══════════════════════════════════════════════════════════
// API
// ══════════════════════════════════════════════════════════
async function api(path,opts={}){
  const isFormData=opts.body instanceof FormData
  const h=isFormData?{}:{'Content-Type':'application/json'}
  Object.assign(h,opts.headers||{})
  if(S.token)h['Authorization']=`Bearer ${S.token}`
  return fetch(path,{...opts,headers:h})
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function render(){
  document.documentElement.setAttribute('data-theme',S.theme)
  const app=document.getElementById('app')
  if(!S.token){app.innerHTML=`<div style="width:100%">${renderLogin()}</div>`;return}
  const currentView=VIEWS.find(v=>v.id===S.view)
  app.innerHTML=`
    <div class="sidebar">
      <div class="sb-brand">
        <div class="brand-name">Pachi<span>Mind</span></div>
        <div class="brand-sub">vault personal</div>
      </div>
      <div class="sb-section">Navegación</div>
      ${VIEWS.map(v=>`
        <div class="nav-item${S.view===v.id?' on':''}" onclick="setView('${v.id}')">
          <span class="ni-icon">${v.icon}</span>
          ${v.label}
          ${v.badge&&S.drafts_count>0?`<span class="ni-badge">${S.drafts_count}</span>`:''}
        </div>`).join('')}
      ${S.stats?`
        <div class="sb-stats">
          <div class="sb-stat">Notas totales <span>${S.stats.total_notes}</span></div>
          <div class="sb-stat">Proyectos <span>${S.stats.by_type?.proyecto||0}</span></div>
          <div class="sb-stat">IA indexables <span>${S.stats.ai_indexable_notes}</span></div>
          ${S.stats.notes_to_review>0?`<div class="sb-stat" style="color:var(--ac);cursor:pointer" onclick="setView('tablero')" title="Ver notas para revisar">Sin revisar <span>${S.stats.notes_to_review}</span></div>`:''}
        </div>`:''}
    </div>
    <div class="main-area">
      <div class="topbar">
        <div class="page-title">${currentView?.label||''}</div>
        <div class="search-box">
          <span style="color:var(--tx3);font-size:12px">⌕</span>
          <input id="search-inp" placeholder="Buscar en el vault..."
            value="${esc(S.searchQ)}" oninput="onSearch(this.value)"
            onkeydown="if(event.key==='Escape'){S.searchQ='';S.searchResults=null;render()}">
        </div>
        <span style="font-size:14px;color:var(--tx3);cursor:pointer;padding:4px;transition:color .2s;user-select:none" onclick="toggleTheme()" title="Cambiar tema">${S.theme==='dark'?'○':'●'}</span>
        <span style="font-size:12px;color:var(--tx3);cursor:pointer;padding:4px;transition:color .2s" onmouseover="this.style.color='var(--tx)'" onmouseout="this.style.color='var(--tx3)'" onclick="logout()" title="Salir">⎋</span>
      </div>
      <div class="main-content${S.view==='tags'?' full':''}">
        ${S.searchQ&&S.searchResults!==null?renderSearch():
          S.view==='tablero'   ?renderTablero():
          S.view==='memoria'   ?renderMemory():
          S.view==='todo'      ?renderTodo():
          S.view==='nueva'     ?renderNueva():
          S.view==='reuniones' ?renderReuniones():
          S.view==='entidades' ?renderEntidades():
          S.view==='vault'     ?renderVault():
          S.view==='chat'      ?renderChat():
          S.view==='tags'      ?renderTags():
          S.view==='sistema'   ?renderSistema():
                                renderInbox()}
      </div>
    </div>
    ${S.openNote?buildOverlayHTML():''}
  `
  if(S.openNote)document.getElementById('app').querySelector('.overlay-bg').onclick=closeNote
}

// ══════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════
function renderLogin(){
  return`<div class="login-page">
    <div class="login-brand">Pachi<span>Mind</span></div>
    <div class="login-line"></div>
    <div class="login-sub">vault personal</div>
    ${S.loginError?`<div class="alert-err" style="max-width:300px">${S.loginError}</div>`:''}
    <input class="fi" style="max-width:300px;text-align:center;letter-spacing:.1em" type="password"
      id="pwd" placeholder="contraseña" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary" style="max-width:300px;width:100%" onclick="doLogin()">Entrar</button>
  </div>`
}
async function doLogin(){
  const pwd=document.getElementById('pwd')?.value;S.loginError=null
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})})
    const d=await r.json()
    if(!r.ok||!d.ok)throw new Error(d.error||'Contraseña incorrecta')
    S.token=d.token;sessionStorage.setItem('pm_token',d.token)
    loadAll();if(S.view==='memoria')loadMemoryProjects();if(S.view==='todo')loadTodo()
  }catch(e){S.loginError=e.message;render()}
}
function logout(){S.token=null;sessionStorage.removeItem('pm_token');S.loginError=null;render()}

// ══════════════════════════════════════════════════════════
// TABLERO
// ══════════════════════════════════════════════════════════
const SECTIONS=[
  {tipo:'proyecto', label:'Proyectos',  icon:'◈', color:'var(--pu)'},
  {tipo:'accion',   label:'Acciones',   icon:'→', color:'var(--ac)'},
  {tipo:'reunion',  label:'Reuniones',  icon:'◎', color:'var(--ac2)'},
  {tipo:'decision', label:'Decisiones', icon:'◆', color:'#60a5fa'},
  {tipo:'recurso',  label:'Recursos',   icon:'▣', color:'#34d399'},
  {tipo:'nota',     label:'Notas',      icon:'◇', color:'var(--tx3)'},
]
const AREAS=['todos','Laboral','Personal','Familia','Amigos','Apostolado']

function renderTablero(){
  if(S.boardsLoading)return`<div class="loading"><div class="spinner"></div><span class="loading-label">Cargando...</span></div>`
  const st=S.stats
  return`
    ${st?`<div class="stats-row">
      <div class="stat-card"><span class="stat-n">${st.total_notes}</span><span class="stat-l">notas</span></div>
      <div class="stat-card"><span class="stat-n">${st.by_type?.proyecto||0}</span><span class="stat-l">proyectos</span></div>
      <div class="stat-card"><span class="stat-n" style="color:var(--ac2)">${st.ai_indexable_notes}</span><span class="stat-l">IA ready</span></div>
      ${S.drafts_count>0?`<div class="stat-card" style="border-color:rgba(232,160,32,.3)"><span class="stat-n" style="color:var(--ac)">${S.drafts_count}</span><span class="stat-l">inbox</span></div>`:''}
    </div>`:''}
    <div class="af-row">
      ${AREAS.map(a=>`<button class="af${S.areaFilter===a?' on':''}" onclick="setArea('${a}')">${a==='todos'?'Todo':a}</button>`).join('')}
    </div>
    ${(S.boards['__revisar']||[]).length?`
    <div style="background:rgba(232,160,32,.06);border:1px solid rgba(232,160,32,.25);border-radius:var(--rl);padding:14px 16px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span style="color:var(--ac);font-size:13px">◈</span>
        <span style="font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--ac)">Para revisar</span>
        <span style="background:var(--ac);color:#080600;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px">${(S.boards['__revisar']||[]).length}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${(S.boards['__revisar']||[]).map(n=>`
          <div style="display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:9px 12px;cursor:pointer;transition:border-color .15s" onclick="openNote('${esc(n.id)}')" onmouseover="this.style.borderColor='var(--ac)'" onmouseout="this.style.borderColor='var(--b)'">
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:500;color:var(--tx)">${esc(n.title.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1'))}</div>
              <div style="font-size:11px;color:var(--tx3);margin-top:2px">${[n.tipo||n.area,n.estado].filter(Boolean).join(' · ')}</div>
            </div>
            <span style="font-size:11px;color:var(--ac);flex-shrink:0">revisar →</span>
            <button style="background:none;border:1px solid var(--b);border-radius:6px;cursor:pointer;color:var(--tx3);font-size:11px;padding:3px 8px;flex-shrink:0" onclick="event.stopPropagation();markRevisado('${esc(n.id)}')" title="Marcar como revisado">✓ Revisado</button>
          </div>`).join('')}
      </div>
    </div>`:''}
    <div class="board-grid">
      ${SECTIONS.map(s=>renderCol(s)).join('')}
    </div>`
}

function renderCol(sec){
  let notes=S.boards[sec.tipo]||[]
  if(S.areaFilter!=='todos')notes=notes.filter(n=>n.area===S.areaFilter)
  const expanded=S.boardExpanded[sec.tipo]
  const show=expanded?notes:notes.slice(0,6)
  return`<div class="board-col">
    <div class="bc-head" style="border-top:2px solid ${sec.color}">
      <span class="bc-icon" style="color:${sec.color}">${sec.icon}</span>
      <span class="bc-title">${sec.label}</span>
      <span class="bc-count">${notes.length}</span>
    </div>
    <div class="bc-body">
      ${show.length?show.map(n=>`<div class="note-row" onclick="openNote('${esc(n.id)}')">
        <div class="nr-dot ${n.prioridad||'none'}"></div>
        <div style="flex:1;min-width:0">
          <div class="nr-title">${esc(n.title.replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1'))}</div>
          <div class="nr-meta">${[n.estado,n.cliente?n.cliente.replace(/\[\[|\]\]/g,''):''].filter(Boolean).join(' · ')}</div>
        </div>
      </div>`).join(''):`<div class="bc-empty">—</div>`}
      ${notes.length>6&&!expanded?`<div class="bc-more" style="cursor:pointer" onclick="S.boardExpanded['${sec.tipo}']=true;render()">+ ${notes.length-6} más</div>`:''}
      ${expanded&&notes.length>6?`<div class="bc-more" style="cursor:pointer" onclick="S.boardExpanded['${sec.tipo}']=false;render()">▲ Colapsar</div>`:''}
    </div>
  </div>`
}

// ══════════════════════════════════════════════════════════
// NOTE OVERLAY
// ══════════════════════════════════════════════════════════
function buildOverlayHTML(){
  const n=S.openNote
  const m=n?.metadata||{}
  const body=n?.content||''
  const stripped=body.replace(/^---[\s\S]*?---\n?/,'').trim()
  const tags=[m.tipo,m.area,m.estado].filter(Boolean)
  return`<div class="overlay">
    <div class="overlay-bg"></div>
    <div class="overlay-panel">
      <div class="op-head">
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tx3)">${esc(n?.path||'')}</span>
        <button class="op-close" onclick="closeNote()">✕</button>
      </div>
      <div class="op-body">
        ${S.openLoading?`<div class="loading"><div class="spinner"></div></div>`:`
          <div class="op-title">${esc(n?.title||'')}</div>
          <div class="tag-row">
            ${tags.map(t=>`<span class="tag ac">${t}</span>`).join('')}
            ${(m.tags||[]).map(t=>`<span class="tag">#${t}</span>`).join('')}
          </div>
          <div class="meta-grid">
            ${m.cliente?`<div class="mg"><div class="mg-k">Cliente</div><div class="mg-v">${esc(m.cliente)}</div></div>`:''}
            ${m.prioridad?`<div class="mg"><div class="mg-k">Prioridad</div><div class="mg-v">${esc(m.prioridad)}</div></div>`:''}
            ${m.fecha?`<div class="mg"><div class="mg-k">Fecha</div><div class="mg-v">${esc(m.fecha)}</div></div>`:''}
            ${(m.personas||[]).length?`<div class="mg" style="grid-column:1/-1"><div class="mg-k">Personas</div><div class="mg-v">${m.personas.map(p=>p.replace(/\[\[|\]\]/g,'')).join(', ')}</div></div>`:''}
            ${(m.proyectos||[]).length?`<div class="mg" style="grid-column:1/-1"><div class="mg-k">Proyectos</div><div class="mg-v">${m.proyectos.map(p=>p.replace(/\[\[|\]\]/g,'')).join(', ')}</div></div>`:''}
          </div>
          ${stripped?`<div style="border-top:1px solid var(--b);padding-top:16px">
            <div class="content-md">${esc(stripped)}</div>
          </div>`:`<div class="es-text">Sin contenido visible</div>`}
          ${m.fuente_inmutable?`<p style="margin-top:16px;color:var(--tx2)">Fuente original protegida. Usá Memoria → Revisar decisiones y acciones para registrar propuestas separadas.</p>`:`
          <div style="border-top:1px solid var(--b);padding-top:14px;margin-top:4px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase">Sacar el jugo</span>
              <button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="runExtractFacts('${esc(n?.id||'')}')" ${S.xfLoading?'disabled':''}>
                ${S.xfLoading?'<div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div>':'🧠 Sacar el jugo'}
              </button>
            </div>
            ${S.xfError?`<div class="alert-err" style="font-size:12px">${esc(S.xfError)}</div>`:''}
            <div style="font-size:12px;color:var(--tx3)">Extrae puntos clave y datos duros (decisiones, números, compromisos) y los agrega a la nota.</div>
          </div>
          <div style="border-top:1px solid var(--b);padding-top:14px;margin-top:4px">
            <div style="font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin-bottom:8px">Adjuntar archivo</div>
            ${renderAttachZone('overlay')}
          </div>
          <div style="border-top:1px solid var(--b);padding-top:14px;margin-top:4px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
              <span style="font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase">Conexiones IA</span>
              <button class="btn btn-ghost" style="padding:5px 10px;font-size:11px" onclick="suggestLinks('${esc(n?.id||'')}')">
                ${S.semLoading?'<div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div>':'✦ Sugerir'}
              </button>
            </div>
            ${S.semError?`<div class="alert-err" style="font-size:12px">${esc(S.semError)}</div>`:''}
            ${S.semSuggestions&&S.semSuggestions.note_id===n?.id?`
              ${!S.semSuggestions.suggestions.length?`<div style="font-size:12px;color:var(--tx3)">No se encontraron conexiones nuevas.</div>`:''}
              ${S.semSuggestions.suggestions.map((s,i)=>`
                <div style="display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--b)">
                  <input type="checkbox" id="sem-${i}" onchange="S.semSelected=Array.from(document.querySelectorAll('[id^=sem-]:checked')).map(el=>el.dataset.id);render()" data-id="${esc(s.note_id)}" style="margin-top:3px;flex-shrink:0" ${S.semSelected.includes(s.note_id)?'checked':''}>
                  <label for="sem-${i}" style="cursor:pointer;flex:1">
                    <div style="font-size:12.5px;font-weight:500;color:var(--tx)">${esc(s.title)}</div>
                    <div style="font-size:11px;color:var(--tx3);margin-top:2px">${esc(s.reason)}</div>
                  </label>
                </div>`).join('')}
              ${S.semSelected.length?`<button class="btn btn-primary" style="margin-top:10px;width:100%;font-size:12px;padding:8px" onclick="applyLinks('${esc(n?.id||'')}')">
                Aplicar ${S.semSelected.length} conexión${S.semSelected.length>1?'es':''}
              </button>`:''}
            `:''}
          </div>
          `}
        `}
      </div>
    </div>
  </div>`
}

async function openNote(id){
  S.openNote={id,title:'...',metadata:{}};S.openLoading=true;render()
  try{
    const r=await api(`/notes/${encodeURIComponent(id)}`)
    if(!r.ok)throw new Error()
    S.openNote=await r.json()
  }catch(e){S.openNote=null}
  S.openLoading=false;render()
}
function closeNote(){S.openNote=null;render()}

// ══════════════════════════════════════════════════════════
// SEARCH
// ══════════════════════════════════════════════════════════
let st=null
function onSearch(q){
  S.searchQ=q;clearTimeout(st)
  if(q.trim().length<2){S.searchResults=null;render();return}
  S.searchLoading=true;render()
  st=setTimeout(async()=>{
    try{const r=await api(`/search?q=${encodeURIComponent(q)}&limit=20`);S.searchResults=(await r.json()).results||[]}catch(e){S.searchResults=[]}
    S.searchLoading=false;render()
    setTimeout(()=>{const el=document.getElementById('search-inp');if(el){el.focus();el.selectionStart=el.selectionEnd=el.value.length}},10)
  },400)
}
function renderSearch(){
  if(S.searchLoading)return`<div class="loading"><div class="spinner"></div></div>`
  if(!S.searchResults?.length)return`<div class="empty-state"><div class="es-icon">⌕</div><div class="es-text">Sin resultados para "${esc(S.searchQ)}"</div></div>`
  return`<div style="font-size:12px;color:var(--tx3);margin-bottom:14px">${S.searchResults.length} resultado${S.searchResults.length!==1?'s':''} — <em>${esc(S.searchQ)}</em></div>
    ${S.searchResults.map(r=>`<div class="sr-item" onclick="openNote('${esc(r.id)}')">
      <div class="sr-title">${esc(r.title)}</div>
      <div class="sr-meta">${[r.type,r.area].filter(Boolean).join(' · ')} · ${Math.round(r.score*100)}%</div>
      <div class="sr-excerpt">${esc(r.excerpt)}</div>
    </div>`).join('')}`
}

// ══════════════════════════════════════════════════════════
// NUEVA NOTA
// ══════════════════════════════════════════════════════════
function renderNueva(){
  return`<div class="form-wrap">${
    S.nnStep==='done'?renderNuevaDone():
    S.nnStep==='reviewing'?renderNuevaReview():
    S.nnStep==='manual'?renderNuevaManual():
    renderNuevaInput()}</div>`
}

function renderNuevaInput(){
  return`
    <div class="section-title">Nueva nota</div>
    <div class="section-sub">Escribí, pegá o dictá. Gemini clasifica y organiza en el vault.</div>
    <label class="field-label">Título <span style="font-size:10px;text-transform:none;letter-spacing:0">(opcional)</span></label>
    <input class="fi" type="text" placeholder="Reunión con cliente, idea, decisión..."
      value="${esc(S.nnTitle)}" oninput="S.nnTitle=this.value">
    <label class="field-label">Contenido</label>
    <textarea class="fi" placeholder="Escribí, pegá texto o grabá con el micrófono..." oninput="S.nnContent=this.value">${esc(S.nnContent)}</textarea>
    <label class="field-label">Adjuntar archivo <span style="font-size:10px;text-transform:none;letter-spacing:0">(el embed se inserta en el contenido)</span></label>
    ${renderAttachZone('nnContent')}
    <label class="field-label" style="margin-top:14px">Micrófono</label>
    <div class="audio-row">

  if(!confirm('¿Descartar este borrador? Se archiva y deja de aparecer en el Inbox.'))return
  try{
    const r=await api(`/notes/${encodeURIComponent(S.ibNote.id)}`,{method:'PATCH',body:JSON.stringify({estado:'archivado'})})
    if(!r.ok)throw new Error(await r.text())
    resetIb()

}

async function toggleRec(){if(S.recording)stopRec();else await startRec()}
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true})
    const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4'
    S.recorder=new MediaRecorder(stream,{mimeType:mime});const chunks=[]
    S.recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)}
    S.recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());await transcribe(new Blob(chunks,{type:mime}),mime)}
    S.recorder.start();S.recording=true;S.recSecs=0
    S.recTimer=setInterval(()=>{S.recSecs++;const el=document.getElementById('rec-timer');if(el)el.textContent=`${Math.floor(S.recSecs/60)}:${String(S.recSecs%60).padStart(2,'0')}`,1000})
    render()
  }catch(e){S.nnError='Micrófono: '+e.message;render()}
}
function stopRec(){clearInterval(S.recTimer);S.recording=false;S.transcribing=true;S.recorder?.stop();render()}
async function transcribe(blob,mime){
  try{
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)})
    const r=await fetch('/api/ai/transcribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audioBase64:b64,mimeType:mime.split(';')[0]})})
    if(!r.ok)throw new Error()
    const d=await r.json();const text=d.text||d.transcription||''
    S.nnContent=S.nnContent?S.nnContent+'\n\n'+text:text
  }catch(e){S.nnError='Error al transcribir'}
  S.transcribing=false;render()
}

{

function parseGemini(raw){

  return{
    title:d.suggested_title||d.title||fallbackTitle||'',
    tipo:d.suggested_tipo||d.tipo||'nota',
    area:d.suggested_area||d.area||'Laboral',
    estado:d.suggested_estado||d.estado||'activo',
    sensibilidad:d.sensibilidad||'normal',
    ia_permiso:d.ia_permiso||'allow',
    tags:d.suggested_tags||d.tags||[],
    cliente:d.suggested_cliente||d.cliente||'',
    personas:d.suggested_personas||d.personas||[],
    content:d.suggested_content||d.content||fallbackContent||'',
    comment:d.comment||'',
  }
}

async function processAllInbox(){
  S.paLoading=true;S.paTotal=0;S.paDone=0;S.paResults=[];S.paError=null;render()
  try{
    const h=S.token?{'Authorization':`Bearer ${S.token}`}:{}
    const r=await fetch('/api/ai/process-all',{headers:h})
    if(!r.ok)throw new Error(`Error ${r.status}`)
    const reader=r.body.getReader();const dec=new TextDecoder();let buf=''
    while(true){
      const{done,value}=await reader.read();if(done)break
      buf+=dec.decode(value,{stream:true})
      const lines=buf.split('\n');buf=lines.pop()
      for(const line of lines){
        if(!line.startsWith('data:'))continue
        try{
          const d=JSON.parse(line.slice(5).trim())
          if(d.type==='start'){S.paTotal=d.total}
          else if(d.type==='saved'){S.paDone++;S.paResults.push(d)}
          else if(d.type==='error'){S.paDone++;S.paResults.push({...d,tipo:''})}
          else if(d.type==='done'){S.paLoading=false;loadAll()}
          render()
        }catch(_){}
      }
    }
  }catch(e){S.paError=e.message}
  S.paLoading=false;render()
}

async function detectEnSuggestions(){
  try{
    const r=await api('/notes?tipo=reunion&per_page=20');const notas=await r.json()
    const enVault=new Set((S.enList['persona']||[]).map(n=>n.title.split('—')[0].split('-')[0].trim().toLowerCase()))
    const sin=new Set()
    for(const n of(notas.results||[])){
      for(const p of(n.metadata?.personas||[])){
        const clean=p.replace(/\[\[|\]\]/g,'').split('—')[0].split('-')[0].trim()
        if(clean&&!['pablo','pachi'].includes(clean.toLowerCase())&&!enVault.has(clean.toLowerCase()))sin.add(clean)

    }
    S.enSuggestions=[...sin]
  }catch(e){}
}

async function loadBoards(){
  S.boardsLoading=true
  try{
    // Paginate to get all notes
    let all=[],page=1,total=Infinity
    while(all.length<total){
      const r=await api(`/notes?per_page=100&page=${page}`);if(!r.ok)break
      const d=await r.json();total=d.total||0
      all=[...all,...(d.results||[])];page++
      if(d.results?.length<100)break
    }
    S.allNotes=all
    const boards={},pendingReview=[]
    for(const n of all){
      const t=n.metadata?.tipo||'nota';const m=n.metadata||{}
      const item={id:n.id,title:n.title,area:m.area,estado:m.estado,prioridad:m.prioridad,cliente:m.cliente,revisado:m.revisado,tags:m.tags||[],tipo:t}
      if(!boards[t])boards[t]=[]
      boards[t].push(item)
      if(!m.revisado&&m.estado!=='borrador'&&m.estado!=='archivado')pendingReview.push(item)
    }
    boards['__revisar']=pendingReview
    S.boards=boards
  }catch(e){}
  S.boardsLoading=false;render()
}

  S.ibLoading=true;S.ibError=null;render()
  try{

    if(!r.ok)throw new Error(await r.text())
    const d=await r.json();S.ibDrafts=d.results||[];S.drafts_count=S.ibDrafts.length

}

async function uploadAttachment(file, targetField){
  if(!file)return
  S.attachUploading=true;S.attachError=null;render()
  try{
    const fd=new FormData();fd.append('file',file)
    const r=await api('/attachments',{method:'POST',headers:{},body:fd})
    if(!r.ok){const t=await r.text();throw new Error(t)}
    const d=await r.json()
    // Insertar embed en el campo de contenido activo
    const embed=d.embed
    if(targetField==='nnContent'){
      S.nnContent=(S.nnContent?S.nnContent+'\n\n':'')+embed
    }else if(targetField==='ibContent'&&S.ibParsed){
      S.ibParsed.content=(S.ibParsed.content?S.ibParsed.content+'\n\n':'')+embed
    }
    S.attachList=[{filename:d.filename,embed:d.embed,size_kb:d.size_kb,is_image:d.is_image},...S.attachList]
    await navigator.clipboard.writeText(embed).catch(()=>{})
  }catch(e){S.attachError=e.message}
  S.attachUploading=false;render()
}
function handleAttachDrop(e, targetField){
  e.preventDefault()
  const file=e.dataTransfer?.files?.[0]||e.target.files?.[0]
  if(file)uploadAttachment(file, targetField)
}
function renderAttachZone(targetField){
  return`
    <div style="border:1.5px dashed var(--b);border-radius:var(--r);padding:12px 16px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative"
      ondragover="event.preventDefault();this.style.borderColor='var(--ac)'"
      ondragleave="this.style.borderColor='var(--b)'"
      ondrop="handleAttachDrop(event,'${targetField}');this.style.borderColor='var(--b)'"
      onclick="document.getElementById('attach-inp-${targetField}').click()">
      <input id="attach-inp-${targetField}" type="file" style="display:none"
        accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.svg,.mp3,.mp4,.m4a,.wav,.doc,.docx,.xls,.xlsx,.txt,.md,.csv,.zip"
        onchange="handleAttachDrop(event,'${targetField}')">
      ${S.attachUploading
        ?'<div class="spinner" style="width:14px;height:14px;border-width:2px;margin:0 auto"></div>'
        :`<span style="font-size:12px;color:var(--tx3)">📎 Arrastrá o hacé click para adjuntar un archivo</span>`}
    </div>
    ${S.attachError?`<div class="alert-err" style="font-size:12px;margin-top:6px">${esc(S.attachError)}</div>`:''}
    ${S.attachList.length?`
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:4px">
        ${S.attachList.slice(0,3).map(a=>`
          <div style="display:flex;align-items:center;gap:8px;background:var(--bg3);border-radius:6px;padding:5px 10px;font-size:12px">

            <span style="color:var(--tx3);flex-shrink:0">${a.size_kb}KB</span>
            <button onclick="navigator.clipboard.writeText('${esc(a.embed)}')" style="background:none;border:none;cursor:pointer;color:var(--tx3);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--bg4)" title="Copiar embed">⎘</button>
          </div>`).join('')}

}

function buildTagIndex(){
  const idx={}
  for(const n of(S.allNotes||[])){
    if(n.metadata?.estado==='archivado')continue
    for(const t of(n.metadata?.tags||[])){
      if(!t)continue
      if(!idx[t])idx[t]=[]
      idx[t].push(n)
    }
  }
  return idx
}

function fmtDate(iso){
  if(!iso)return '—'
  try{
    const d=new Date(iso)
    return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})
  }catch{return iso}
}

function mergeDatosDurosSection(content,sectionMarkdown){
  // Idempotente: si ya se corrió antes, el bloque agregado empieza en
  // "## Puntos clave" y va al final de la nota — lo recortamos y reemplazamos.
  const idx=content.indexOf('\n## Puntos clave')
  const base=idx>=0?content.slice(0,idx):content
  return `${base.trimEnd()}\n\n${sectionMarkdown.trim()}\n`
}
async function runExtractFacts(noteId){
  if(!noteId)return
  S.xfLoading=true;S.xfError=null;render()
  try{
    const nr=await api(`/notes/${encodeURIComponent(noteId)}`)
    if(!nr.ok)throw new Error(await nr.text())
    const note=await nr.json()
    const content=note.content||note.excerpt||''
    const fr=await fetch('/api/ai/extract-facts',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':S.token?`Bearer ${S.token}`:''},
      body:JSON.stringify({title:note.title,content}),
    })
    if(!fr.ok)throw new Error(await fr.text())
    const{section_markdown}=await fr.json()
    const merged=mergeDatosDurosSection(content,section_markdown)
    const pr=await api(`/notes/${encodeURIComponent(noteId)}`,{method:'PATCH',body:JSON.stringify({content:merged})})
    if(!pr.ok)throw new Error(await pr.text())
    if(S.openNote?.id===noteId){
      const rr=await api(`/notes/${encodeURIComponent(noteId)}`)
      if(rr.ok)S.openNote=await rr.json()
    }
  }catch(e){S.xfError=e.message}
  S.xfLoading=false;render()
}
async function extractFactsForImported(results){
  for(const r of results){
    if(r.ok&&r.id)await runExtractFacts(r.id)
  }
}

async function suggestLinks(noteId){
  S.semLoading=true;S.semError=null;S.semSuggestions=null;S.semSelected=[];render()
  try{
    const r=await api(`/vault/links/suggest/${encodeURIComponent(noteId)}`)
    if(!r.ok)throw new Error(await r.text())
    S.semSuggestions=await r.json()
  }catch(e){S.semError=e.message}
  S.semLoading=false;render()
}
async function applyLinks(sourceId){
  const links=S.semSelected.map(tid=>({source_id:sourceId,target_id:tid}))
  if(!links.length)return
  try{
    const r=await api('/vault/links/apply',{method:'POST',body:JSON.stringify({links})})
    if(!r.ok)throw new Error(await r.text())
    const d=await r.json()
    S.semSuggestions=null;S.semSelected=[]
    alert(`${d.applied} conexión${d.applied>1?'es':''} aplicada${d.applied>1?'s':''}`)
    render()
  }catch(e){alert('Error: '+e.message)}
}

async function chatSend(){
  const msg=S.chatInput.trim()
  if(!msg||S.chatLoading)return
  S.chatMessages.push({role:'user',text:msg})
  S.chatInput='';S.chatLoading=true;S.chatError=null;render()
  try{
    // Obtener contexto del vault relevante al mensaje
    const ctxR=await api('/ai/context',{method:'POST',body:JSON.stringify({query:msg,max_results:6,filters:{}})})
    const ctx=ctxR.ok?await ctxR.json():null
    const notesContext=(ctx?.results||[]).map(n=>`- ${n.title} (${n.tipo||''}): ${n.excerpt||''}`).join('\n')
    // Enviar al chat con contexto
    const history=S.chatMessages.slice(-10,-1).map(m=>({role:m.role,text:m.text}))
    const r=await api('/api/ai/chat',{method:'POST',body:JSON.stringify({message:msg,notesContext,history})})
    if(!r.ok)throw new Error(await r.text())
    const d=await r.json()
    S.chatMessages.push({role:'model',text:d.text||''})
  }catch(e){S.chatError=e.message;S.chatMessages.push({role:'model',text:'Error: '+e.message,err:true})}
  S.chatLoading=false;render()
  setTimeout(()=>{const c=document.getElementById('chat-msgs');if(c)c.scrollTop=c.scrollHeight},50)
}
function chatMd(txt){
  return txt
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code style="background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:JetBrains Mono,monospace;font-size:11px">$1</code>')
    .replace(/^- (.+)/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/s,'<ul style="padding-left:16px;margin:4px 0">$1</ul>')
    .replace(/\n/g,'<br>')
}

function captureBase(){return '/api/memory/projects/'+encodeURIComponent(S.memoryId)+'/meetings'}
async function captureJSON(path,opts={}){
  const r=await api(path,opts);const data=await r.json();
  if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:(data.error||'No se pudo completar la operación ('+r.status+'). Revisá los datos e intentá nuevamente.'));
  return data;
}
function beginCapture(){
  if(S.capBusy)return;
  if(S.capOpen&&!S.capMeeting&&S.capForm.content&&!confirm('¿Descartar la captura sin guardar?'))return;

async function saveCapture(){
  if(S.capBusy)return;
  const form=document.getElementById('capture-form');if(form&&!form.reportValidity())return;
  S.capBusy=true;S.capError=null;render();
  try{
    const f=S.capForm;

    S.capMeeting=await captureJSON(captureBase()+'/'+encodeURIComponent(result.id));

async function suggestCapture(){

async function saveCaptureProposals(){
  if(S.capBusy||!S.capMeeting)return;
  const selected=S.capSuggestions.filter(p=>p.selected);if(!selected.length)return;
  const items=selected.map(({selected,...p})=>({...p,responsable:p.responsable?.trim()||null,vencimiento:p.vencimiento||null}));
  if(items.some(p=>!p.title.trim()||!p.detalle.trim()||!p.evidencia.trim()||!S.capMeeting.content.includes(p.evidencia))){S.capError='Completá título, detalle y una cita copiada exactamente del original.';render();return}
  S.capBusy=true;S.capError=null;render();
  try{
    await captureJSON(captureBase()+'/'+encodeURIComponent(S.capMeeting.id)+'/proposals',{method:'POST',body:JSON.stringify({items})});
    S.capProposals=await captureJSON(captureBase()+'/'+encodeURIComponent(S.capMeeting.id)+'/proposals');
    S.capSuggestions=S.capSuggestions.filter(p=>!p.selected);S.capNotice='Propuestas guardadas en Inbox. Aprobá o descartá cada una abajo.';
  }catch(e){S.capError=e.message}
  S.capBusy=false;render();

  }catch(e){S.capError=e.message}
  S.capBusy=false;render();
}

      <label style="display:block;margin:12px 0">Participantes (uno por línea)<textarea class="fi" rows="2" style="width:100%" oninput="S.capForm.participantes=this.value">${esc(f.participantes)}</textarea></label>
      <label style="display:block;margin:12px 0">Transcripción o notas originales<textarea class="fi" required rows="10" style="width:100%" oninput="S.capForm.content=this.value">${esc(f.content)}</textarea></label>
      <label><input type="checkbox" ${f.allow_ai?'checked':''} onchange="S.capForm.allow_ai=this.checked"> Permitir uso de esta reunión por IA, según los permisos del proyecto</label>
      <p>Se conserva el texto original. Si pegás un resumen, registrá que esa es la fuente disponible.</p>
      <button class="btn btn-primary" type="submit">Guardar original</button>
    </fieldset></form>`:`
      <p>${esc(m.fecha)} · Origen: ${esc(m.source)}</p>
      <details><summary>Ver original para contrastar las propuestas</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit">${esc(m.content)}</pre></details>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">
        ${m.allow_ai?`<button class="btn btn-ghost" ${disabled} onclick="suggestCapture()">Sugerir decisiones y acciones con IA</button>`:'<p>Esta fuente no permite procesamiento por IA. Podés registrar propuestas manuales.</p>'}
        <button class="btn btn-ghost" ${disabled} onclick="addManualProposal()">Agregar propuesta manual</button>
      </div>
      <fieldset ${disabled} style="border:0;padding:0;min-width:0">
      ${S.capSuggestions.map((p,i)=>`<article style="border-top:1px solid var(--b);padding:16px 0">
        <label><input type="checkbox" ${p.selected?'checked':''} onchange="S.capSuggestions[${i}].selected=this.checked"> Guardar esta propuesta</label>
        <label style="display:block;margin:12px 0">Tipo <select class="fi" onchange="S.capSuggestions[${i}].tipo=this.value"><option value="accion" ${p.tipo==='accion'?'selected':''}>Acción</option><option value="decision" ${p.tipo==='decision'?'selected':''}>Decisión</option></select></label>
        ${edit(p,i,'title','Título')}${edit(p,i,'detalle','Qué se acordó',true)}${edit(p,i,'evidencia','Cita literal del original',true)}${edit(p,i,'responsable','Responsable (vacío si no consta)')}${edit(p,i,'vencimiento','Vencimiento (vacío si no consta)')}
      </article>`).join('')}
      ${S.capSuggestions.length?'<button class="btn btn-primary" onclick="saveCaptureProposals()">Guardar propuestas en Inbox</button>':''}
      </fieldset>
      <h4>Propuestas guardadas (${S.capProposals.length})</h4>
      ${S.capProposals.map((p,i)=>`<article style="border-top:1px solid var(--b);padding:16px 0"><strong>${esc(p.title)}</strong> · ${esc(p.tipo)}
        <p>${esc(p.detalle)}</p><blockquote style="white-space:pre-wrap">${esc(p.evidencia)}</blockquote>
        <p>Responsable: ${esc(p.responsable||'Sin confirmar')} · Vencimiento: ${esc(p.vencimiento||'Sin confirmar')}</p>
        ${p.review?`<p>${p.review==='approve'?'Aprobada':'Descartada'}${p.approved_path?' · '+esc(p.approved_path):''}</p>`:`<button class="btn btn-primary" ${disabled} onclick="reviewCaptureProposal(${i},'approve')">Aprobar ${p.tipo==='accion'?'como pendiente':'decisión'}</button> <button class="btn btn-ghost" ${disabled} onclick="reviewCaptureProposal(${i},'discard')">Descartar</button>`}
      </article>`).join('')}
    `}
  </section>`;
}

// Memoria por proyecto: consulta sin modificar fuentes.
S.memoryExport=''; S.memoryProjects=null; S.memoryData=null; S.memoryError=null; S.memoryLoading=false; S.memoryId='';
let memoryRequest=0;
async function loadMemoryProjects(){
  S.memoryLoading=true;S.memoryError=null;render();
  try{
    const r=await api('/api/memory/projects/memory');
    if(!r.ok)throw new Error('No se pudieron cargar los proyectos ('+r.status+').');
    S.memoryProjects=await r.json();
  }catch(e){S.memoryError=e.message}
  S.memoryLoading=false;render();
}
async function selectMemory(id){
  if(S.capBusy)return;
  if(S.capOpen&&!S.capMeeting&&S.capForm.content&&!confirm('¿Cambiar de proyecto sin guardar la captura?')){render();return}
  S.capOpen=false;S.capMeeting=null;S.capSuggestions=[];S.capProposals=[];
  const request=++memoryRequest;
  S.memoryId=id;S.memoryData=null;S.memoryError=null;S.memoryExport='';
  S.memoryLoading=!!id;render();
  if(!id)return;
  try{
    const r=await api('/api/memory/projects/'+encodeURIComponent(id)+'/memory');
    if(!r.ok)throw new Error('No se pudo cargar la memoria ('+r.status+').');
    const data=await r.json();
    if(request===memoryRequest)S.memoryData=data;
  }catch(e){if(request===memoryRequest)S.memoryError=e.message}
  if(request===memoryRequest){S.memoryLoading=false;render()}
}
async function viewMemoryExport(){
  const id=S.memoryId;if(!id)return;
  try{
    const r=await api('/api/memory/projects/'+encodeURIComponent(id)+'/memory.md');
    if(!r.ok)throw new Error('No se pudo preparar el contexto ('+r.status+').');
    const text=await r.text();if(S.memoryId!==id)return;
    S.memoryExport=text;S.memoryError=null;
  }catch(e){S.memoryError=e.message}
  render();
}
async function exportMemory(){
  const id=S.memoryId;if(!id)return;
  try{
    const r=await api('/api/memory/projects/'+encodeURIComponent(id)+'/memory.md');
    if(!r.ok)throw new Error('No se pudo exportar la memoria ('+r.status+').');
    const url=URL.createObjectURL(new Blob([await r.text()],{type:'text/markdown;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download='memoria-'+id+'.md';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){S.memoryError=e.message;render()}
}
function memoryOpenSource(index){const n=S.memoryData?.sources[index];if(n)openNote(n.id)}
function renderMemory(){
  const data=S.memoryData;
  const groups=[['Ficha del proyecto',n=>n.id===data?.project_id],
    ['Reuniones y registros',n=>['reunion','registro'].includes(n.tipo)],
    ['Decisiones registradas',n=>n.tipo==='decision'],
    ['Acciones registradas',n=>n.tipo==='accion'],
    ['Otras fuentes vinculadas',n=>!['reunion','registro','decision','accion'].includes(n.tipo)&&n.id!==data?.project_id]];
  return `<div class="memory-view" style="max-width:900px;margin:auto">
    <h2>Memoria por proyecto</h2>
    <p style="color:var(--tx2)">Reuniones, decisiones y acciones conectadas a sus fuentes. Elegí un proyecto para reconstruir su contexto.</p>
    <label for="memory-project">Proyecto</label>
    <select id="memory-project" ${S.capBusy?'disabled':''} class="fi" onchange="selectMemory(this.value)" style="margin:8px 0 16px;width:100%">
      <option value="">Seleccionar proyecto…</option>
      ${(S.memoryProjects||[]).map(n=>`<option value="${esc(n.id)}" ${n.id===S.memoryId?'selected':''}>${esc(n.title)} — ${esc(n.estado||'sin estado')}</option>`).join('')}
    </select>
    <button class="btn btn-ghost" onclick="loadMemoryProjects()">Actualizar proyectos</button>
    ${S.memoryError?`<p role="alert">${esc(S.memoryError)}</p>`:''}
    ${S.memoryLoading?'<p role="status">Cargando memoria…</p>':''}
    ${S.memoryProjects?.length===0?'<p>No hay proyectos disponibles. Creá una ficha de tipo proyecto y vinculá sus fuentes.</p>':''}
    ${data?`<h3>${esc(data.title)}</h3>
      <button class="btn btn-primary" onclick="viewMemoryExport()">Ver contexto para copiar</button>
      <button class="btn btn-ghost" onclick="exportMemory()">Descargar contexto para IA (.md)</button>
      <button class="btn btn-ghost" ${S.capBusy?'disabled':''} onclick="beginCapture()">Agregar reunión</button>
      ${S.memoryExport?`<label style="display:block;margin:16px 0">Contexto Markdown para cualquier IA<textarea class="fi" readonly rows="12" style="width:100%;margin-top:8px" onfocus="this.select()">${esc(S.memoryExport)}</textarea></label><p>Seleccioná el texto y copialo en la conversación que quieras usar.</p>`:''}
      ${renderCapture()}
      <p style="color:var(--tx2)">La exportación incluye solo fuentes habilitadas para IA. Los estados registrados deben verificarse antes de asumir que siguen vigentes.</p>
      <details style="margin:16px 0"><summary>Alcance de esta memoria · ${data.sources.length} fuentes</summary><ul>${data.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></details>
      ${groups.map(([label,match])=>{
        const rows=data.sources.map((n,i)=>({n,i})).filter(({n})=>match(n));
        return `<section style="margin:24px 0"><h3>${label} (${rows.length})</h3>
          ${rows.length?rows.map(({n,i})=>`<article style="border:1px solid var(--b);border-radius:10px;padding:16px;margin:10px 0">
            <button class="btn btn-ghost" onclick="memoryOpenSource(${i})">${esc(n.title)}</button>
            <p style="font-size:12px;color:var(--tx2)">${esc(n.fecha||'Sin fecha válida')} · ${esc(n.estado||'Sin estado')} · ${n.revisado?'Revisada':'Sin revisar'}</p>
            <p>${esc(n.excerpt)}</p>
            ${n.fuente_inmutable?`<button class="btn btn-ghost" ${S.capBusy?'disabled':''} onclick="reopenCapture(${i})">Revisar decisiones y acciones</button>`:''}
            <small style="overflow-wrap:anywhere">${esc(n.path)} · ${esc(n.relation)}</small>
          </article>`).join(''):'<p style="color:var(--tx2)">No hay fuentes vinculadas de este tipo. Esto no significa que no existan en el vault.</p>'}
        </section>`;
      }).join('')}`:''}
  </div>`;
}

// INIT
// ══════════════════════════════════════════════════════════
document.documentElement.setAttribute('data-theme',S.theme)
// TODO: actividades guardadas en Markdown, con control de concurrencia.
Object.assign(S,{todoItems:[],todoLoading:false,todoBusy:false,todoError:null,todoFilter:'abiertas',todoArea:'todas',todoQuery:'',todoForm:null,todoProjects:[]});
async function loadTodo(){
  S.todoLoading=true;S.todoError=null;render();
  try{const [items,projects]=await Promise.all([captureJSON('/actions/todo'),captureJSON('/api/memory/projects/memory')]);S.todoItems=items;S.todoProjects=projects}
  catch(e){S.todoError=e.message}
  S.todoLoading=false;render();
}
function newTodo(){if(S.todoBusy)return;S.todoForm={request_id:crypto.randomUUID(),title:'',detalle:'',area:'Laboral',project_id:'',responsable:'',vencimiento:'',prioridad:'media'};S.todoError=null;render()}
function editTodo(i){if(S.todoBusy)return;const t=S.todoItems[i];S.todoForm={...t,responsable:t.responsable||'',vencimiento:t.vencimiento||'',editing:true};render()}
async function saveTodo(){
  if(S.todoBusy||!document.getElementById('todo-form').reportValidity())return;
  const f=S.todoForm;S.todoBusy=true;S.todoError=null;render();
  try{
    const payload=f.editing?{revision:f.revision,responsable:f.responsable||null,vencimiento:f.vencimiento||null,prioridad:f.prioridad}:{request_id:f.request_id,title:f.title,detalle:f.detalle,area:f.area,project_id:f.project_id||null,responsable:f.responsable||null,vencimiento:f.vencimiento||null,prioridad:f.prioridad};
    await captureJSON('/actions/todo'+(f.editing?'/'+encodeURIComponent(f.id):''),{method:f.editing?'PATCH':'POST',body:JSON.stringify(payload)});
    S.todoForm=null;await loadTodo();
  }catch(e){S.todoError=e.message}
  S.todoBusy=false;render();
}
async function todoState(i,state){
  if(S.todoBusy)return;const t=S.todoItems[i];S.todoBusy=true;S.todoError=null;render();
  try{const updated=await captureJSON('/actions/todo/'+encodeURIComponent(t.id),{method:'PATCH',body:JSON.stringify({revision:t.revision,estado:state})});S.todoItems[i]=updated}
  catch(e){S.todoError=e.message}
  S.todoBusy=false;render();
}
function todoFilter(value){S.todoFilter=value;render()}
function todoDate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function renderTodo(){
  const today=todoDate(),done=S.todoItems.filter(t=>t.estado==='completado').length,overdue=S.todoItems.filter(t=>t.estado!=='completado'&&t.vencimiento&&t.vencimiento<today).length;
  const items=S.todoItems.map((t,i)=>({...t,index:i})).filter(t=>(S.todoFilter==='todas'||(S.todoFilter==='hechas'?t.estado==='completado':S.todoFilter==='vencidas'?t.estado!=='completado'&&t.vencimiento&&t.vencimiento<today:t.estado!=='completado'))&&(S.todoArea==='todas'||t.area===S.todoArea)&&(!S.todoQuery||[t.title,t.responsable,...t.proyectos].join(' ').toLowerCase().includes(S.todoQuery.toLowerCase())));
  const f=S.todoForm,disabled=S.todoBusy?'disabled':'';
  return `<section class="todo-view" style="max-width:1100px;margin:auto;width:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><div><h2 style="margin:0">TODO · Actividades</h2><p style="color:var(--tx2)">${S.todoItems.length-done} abiertas · ${overdue} vencidas · ${done} hechas</p></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="loadTodo()" ${disabled}>Actualizar</button><button class="btn btn-primary" onclick="newTodo()" ${disabled}>+ Actividad</button></div></div>
    <p style="color:var(--tx2);font-size:13px">Tus actividades personales y de trabajo. Las acciones aprobadas de reuniones aparecen acá con su fuente.</p>
    ${S.todoError?`<p role="alert" style="color:var(--rd)">${esc(S.todoError)}</p>`:''}
    ${f?`<form id="todo-form" onsubmit="event.preventDefault();saveTodo()" style="border:1px solid var(--b);border-radius:12px;padding:20px;margin:16px 0;display:grid;gap:12px">
      <h3 style="margin:0">${f.editing?'Editar actividad':'Nueva actividad'}</h3>
      <label>Actividad<input aria-label="Actividad" required maxlength="200" ${f.editing?'readonly':''} value="${esc(f.title)}" oninput="S.todoForm.title=this.value" style="width:100%"></label>
      ${!f.editing?`<label>Detalle<textarea aria-label="Detalle" maxlength="20000" rows="3" oninput="S.todoForm.detalle=this.value" style="width:100%">${esc(f.detalle)}</textarea></label>
      <div class="todo-fields"><label>Área<select aria-label="Área" onchange="S.todoForm.area=this.value">${['Laboral','Personal','Familia','Amigos','Apostolado'].map(a=>`<option ${f.area===a?'selected':''}>${a}</option>`).join('')}</select></label>
      <label>Proyecto (opcional)<select aria-label="Proyecto" onchange="S.todoForm.project_id=this.value"><option value="">Sin proyecto</option>${S.todoProjects.map(p=>`<option value="${esc(p.id)}" ${f.project_id===p.id?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label></div>`:''}
      <div class="todo-fields"><label>Responsable<input aria-label="Responsable" maxlength="200" value="${esc(f.responsable)}" placeholder="Sin asignar" oninput="S.todoForm.responsable=this.value"></label>
      <label>Vencimiento<input aria-label="Vencimiento" type="date" value="${esc(f.vencimiento)}" oninput="S.todoForm.vencimiento=this.value"></label>
      <label>Prioridad<select aria-label="Prioridad" onchange="S.todoForm.prioridad=this.value">${['alta','media','baja'].map(p=>`<option ${f.prioridad===p?'selected':''}>${p}</option>`).join('')}</select></label></div>
      <div><button class="btn btn-primary" type="submit" ${disabled}>${S.todoBusy?'Guardando…':'Guardar actividad'}</button> <button class="btn btn-ghost" type="button" ${disabled} onclick="S.todoForm=null;render()">Cancelar</button></div>
    </form>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:20px 0">
      ${[['abiertas','Abiertas'],['vencidas','Vencidas'],['hechas','Hechas'],['todas','Todas']].map(([v,l])=>`<button class="btn ${S.todoFilter===v?'btn-primary':'btn-ghost'}" onclick="todoFilter('${v}')">${l}</button>`).join('')}
      <select aria-label="Filtrar área" onchange="S.todoArea=this.value;render()"><option value="todas">Todas las áreas</option>${['Laboral','Personal','Familia','Amigos','Apostolado'].map(a=>`<option ${S.todoArea===a?'selected':''}>${a}</option>`).join('')}</select>
      <input aria-label="Buscar actividades" placeholder="Actividad, proyecto o responsable" value="${esc(S.todoQuery)}" onchange="S.todoQuery=this.value;render()" style="flex:1;min-width:200px">
    </div>
    ${S.todoLoading?'<p role="status">Cargando actividades…</p>':items.length?items.map(t=>`<article style="border:1px solid var(--b);border-radius:10px;padding:16px;margin:10px 0;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
      <button class="btn btn-ghost" aria-label="${t.estado==='completado'?'Reabrir':'Completar'} ${esc(t.title)}" onclick="todoState(${t.index},'${t.estado==='completado'?'pendiente':'completado'}')" ${disabled}>${t.estado==='completado'?'✓':'○'}</button>
      <div style="flex:1;min-width:180px"><strong style="${t.estado==='completado'?'text-decoration:line-through;opacity:.65':''}">${esc(t.title)}</strong><p style="font-size:12px;color:var(--tx2);margin:7px 0">${esc(t.area||'Sin área')} · ${esc(t.responsable||'Sin asignar')} · Prioridad ${esc(t.prioridad)}</p>
      ${t.proyectos.length?`<p style="font-size:12px;margin:5px 0">${t.proyectos.map(p=>esc(p.replace(/\[\[|\]\]/g,''))).join(' · ')}</p>`:''}
      <p style="font-size:12px;margin:5px 0;${t.estado!=='completado'&&t.vencimiento&&t.vencimiento<today?'color:var(--rd)':''}">${t.vencimiento?`${t.estado!=='completado'&&t.vencimiento<today?'Vencida · ':''}${esc(t.vencimiento)}`:'Sin vencimiento'}${t.fuente_ref?' · De una reunión':''}</p></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><select aria-label="Estado de ${esc(t.title)}" ${disabled} onchange="todoState(${t.index},this.value)">${[['pendiente','Pendiente'],['en_proceso','En curso'],['completado','Hecha']].map(([v,l])=>`<option value="${v}" ${t.estado===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn btn-ghost" ${disabled} onclick="editTodo(${t.index})">Editar</button><button class="btn btn-ghost" onclick="openNote('${esc(t.id)}')">Ver nota</button></div>
    </article>`).join(''):'<p style="padding:32px;border:1px dashed var(--b);border-radius:12px;color:var(--tx2)">No hay actividades en esta vista. Agregá una o aprobá una acción desde Memoria.</p>'}
  </section>`;
}

const qsView=new URLSearchParams(location.search).get('view')
if(qsView&&VIEWS.some(v=>v.id===qsView))S.view=qsView
if(S.token){loadAll();if(S.view==='memoria')loadMemoryProjects();if(S.view==='todo')loadTodo();render()}else render()
</script>
